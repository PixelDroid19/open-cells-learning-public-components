<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Cells public components</title>
<style>
:root{color-scheme:light}body{margin:0;background:#f8fafc;color:#17213a;font:16px/1.45 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:2rem}.masthead{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}.masthead h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem)}.masthead p{margin:.35rem 0 0;color:#52627a}.toolbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1rem 0 1.5rem;padding:1rem;border:1px solid #dbe3ef;border-radius:1rem;background:#fff}.toolbar label{display:flex;align-items:center;gap:.5rem;font-weight:700}.toolbar select{border:1px solid #b9c7d9;border-radius:.6rem;padding:.55rem .7rem;background:#fff;color:inherit;font:inherit}.toolbar output{margin-left:auto;color:#52627a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 18rem;gap:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{min-height:7rem;padding:1rem;border:1px solid #dbe3ef;border-radius:1rem;background:white;box-shadow:0 8px 22px #0f172a12}.tag{font:700 .72rem ui-monospace,monospace;color:#52627a}.preview{display:flex;align-items:center;min-height:3rem;margin-top:.75rem}.events{position:sticky;top:1rem;align-self:start;padding:1rem;border:1px solid #dbe3ef;border-radius:1rem;background:#17213a;color:#fff}.events h2{margin:0;display:flex;justify-content:space-between;font-size:1rem}.events ol{display:grid;gap:.6rem;margin:1rem 0 0;padding-left:1.2rem;color:#dbeafe;font-size:.8rem}.events li{overflow-wrap:anywhere}.empty{color:#94a3b8;font-style:italic}@media(max-width:800px){.layout{grid-template-columns:1fr}.events{position:static}}
</style></head>
<body><main><header class="masthead"><div><h1>Open Cells public components</h1><p>106 neutral Lit elements with scoped registration, i18n and events.</p></div><strong id="component-count"></strong></header><section class="toolbar"><label for="language">Language <select id="language"><option value="en">English</option><option value="es">Español</option></select></label><output id="event-count">0 events</output></section><div class="layout"><section class="grid" id="grid" aria-label="Component gallery"></section><aside class="events" aria-live="polite"><h2><span>Events</span><span id="event-number">00</span></h2><ol id="events"><li class="empty">No events captured yet.</li></ol></aside></div></main><script type="module" src="./demo.js"></script></body></html>
